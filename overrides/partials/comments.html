{% if page.meta.comments %}
<h2 id="__comments">{{ lang.t("meta.comments") }}</h2>

<script src="https://giscus.app/client.js"
        data-repo="rainayom/RainAYOM.github.io"
        data-repo-id="R_kgDOV9nhcA"
        data-category="Announcements"
        data-category-id="DIC_kwDOV9nhcM4DMFBc"
        data-mapping="pathname"
        data-strict="0"
        data-reactions-enabled="1"
        data-emit-metadata="0"
        data-input-position="top"
        data-theme="light"
        data-lang="zh-CN"
        data-loading="lazy"
        crossorigin="anonymous"
        async>
</script>

<script>
  (function () {
    // 让 giscus 跟随站点的明亮/暗黑 palette
    var giscus = document.querySelector("script[src*=giscus]");
    var palette = __md_get("__palette");
    if (palette && typeof palette.color === "object") {
      giscus.setAttribute(
        "data-theme",
        palette.color.scheme === "slate" ? "transparent_dark" : "light"
      );
    }

    document.addEventListener("DOMContentLoaded", function () {
      var ref = document.querySelector("[data-md-component=palette]");
      if (!ref) return;
      ref.addEventListener("change", function () {
        var p = __md_get("__palette");
        if (!p || typeof p.color !== "object") return;
        var theme = p.color.scheme === "slate" ? "transparent_dark" : "light";
        var frame = document.querySelector(".giscus-frame");
        if (frame) {
          frame.contentWindow.postMessage(
            { giscus: { setConfig: { theme: theme } } },
            "https://giscus.app"
          );
        }
      });
    });
  })();
</script>
{% endif %}
